name: Validate reliability lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: |
          python -m pip install --disable-pip-version-check ansible-core PyYAML
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell scripts
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Validate Python and tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v

      - name: Validate JSON and YAML
        run: |
          python - <<'PY'
          import json
          import pathlib
          import yaml

          root = pathlib.Path('.')
          for path in root.glob('monitoring/**/*.yml'):
              yaml.safe_load(path.read_text())
          yaml.safe_load((root / 'monitoring/compose.yaml').read_text())
          json.loads((root / 'config/fleet.json').read_text())
          json.loads((root / 'monitoring/grafana/dashboards/fleet-overview.json').read_text())
          PY

      - name: Validate Ansible playbook
        run: ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --syntax-check

      - name: Validate Docker Compose
        env:
          GRAFANA_ADMIN_PASSWORD: ci-validation-only
        run: docker compose -f monitoring/compose.yaml config --quiet

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml
