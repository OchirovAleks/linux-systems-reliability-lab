apiVersion: v1
kind: Service
metadata:
  name: reliability-web
  namespace: reliability-lab
  labels:
    app.kubernetes.io/name: reliability-web
    app.kubernetes.io/part-of: linux-systems-reliability-lab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: reliability-web
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
      protocol: TCP
