apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-missing
  namespace: reliability-training
  labels:
    app.kubernetes.io/name: image-missing
    reliability-lab/scenario: image-missing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: image-missing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-missing
        reliability-lab/scenario: image-missing
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: reliability-lab
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: image-missing
          image: reliability-web:missing
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
