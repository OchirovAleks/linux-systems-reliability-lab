apiVersion: apps/v1
kind: Deployment
metadata:
  name: oomkilled
  namespace: reliability-training
  labels:
    app.kubernetes.io/name: oomkilled
    reliability-lab/scenario: oomkilled
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oomkilled
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oomkilled
        reliability-lab/scenario: oomkilled
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: reliability-lab
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oomkilled
          image: reliability-web:0.1.0
          imagePullPolicy: Never
          command:
            - python3
            - -c
            - |
              import time
              blocks = []
              while True:
                  blocks.append(bytearray(1024 * 1024))
                  time.sleep(0.05)
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
