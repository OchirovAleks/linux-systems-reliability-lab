groups:
  - name: fleet-availability
    rules:
      - alert: FleetNodeDown
        expr: up{job="node"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Fleet node {{ $labels.node }} is unreachable"
          description: "Prometheus cannot scrape Node Exporter on {{ $labels.instance }}."

      - alert: FleetWebServiceDown
        expr: probe_success{job="web"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Web service on {{ $labels.node }} is unavailable"
          description: "The HTTP probe for {{ $labels.instance }} has failed for 30 seconds."

      - alert: KubernetesWebServiceDown
        expr: probe_success{job="kubernetes-web"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes web endpoint on {{ $labels.node }} is unavailable"
          description: "The NodePort HTTP probe for {{ $labels.instance }} has failed for 30 seconds."

      - alert: FleetClockUnsynchronized
        expr: node_timex_sync_status{job="node"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Clock synchronization lost on {{ $labels.node }}"
          description: "The kernel reports that the system clock is not synchronized."

      - alert: FleetClockDrift
        expr: abs(time() - node_time_seconds{job="node"}) > 30
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Clock drift detected on {{ $labels.node }}"
          description: "The node clock differs from Prometheus by more than 30 seconds."
  - name: fleet-capacity
    rules:
      - alert: FleetHighCPU
        expr: 100 - (avg by (instance, node) (rate(node_cpu_seconds_total{job="node",mode="idle"}[2m])) * 100) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU utilization on {{ $labels.node }}"
          description: "CPU utilization has exceeded 85 percent for two minutes."

      - alert: FleetHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"})) * 100 > 90
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High memory utilization on {{ $labels.node }}"
          description: "Available memory has remained below 10 percent for two minutes."

      - alert: FleetLowDiskSpace
        expr: (node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!=""} / node_filesystem_size_bytes{job="node",mountpoint="/",fstype!=""}) * 100 < 15
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Low root filesystem space on {{ $labels.node }}"
          description: "Free space on the root filesystem is below 15 percent."

  - name: kubernetes-reliability
    rules:
      - alert: KubernetesNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes node {{ $labels.node }} is NotReady"
          description: "The node has not reported a Ready condition for one minute."

      - alert: KubernetesDeploymentReplicasMismatch
        expr: >-
          kube_deployment_spec_replicas{namespace=~"reliability-lab|reliability-training"}
          >
          kube_deployment_status_replicas_available{namespace=~"reliability-lab|reliability-training"}
        for: 45s
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"
          description: "Available replicas have remained below the desired count for 45 seconds."

      - alert: KubernetesPodCrashLooping
        expr: >-
          max_over_time(kube_pod_container_status_waiting_reason{
          namespace="reliability-training",reason="CrashLoopBackOff"}[2m]) > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
          description: "A training container has remained in CrashLoopBackOff."

      - alert: KubernetesContainerOOMKilled
        expr: >-
          max_over_time(kube_pod_container_status_last_terminated_reason{
          namespace="reliability-training",reason="OOMKilled"}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.container }} in {{ $labels.pod }} was OOMKilled"
          description: "The container exceeded its Kubernetes memory limit."

      - alert: KubernetesPodUnschedulable
        expr: >-
          max_over_time(kube_pod_status_unschedulable{
          namespace="reliability-training"}[2m]) > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} cannot be scheduled"
          description: "The Kubernetes scheduler cannot place the training Pod on any node."
