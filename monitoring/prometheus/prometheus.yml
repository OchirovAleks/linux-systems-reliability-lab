global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node
    static_configs:
      - targets:
          - 192.168.252.2:9100
        labels:
          node: control-node
      - targets:
          - 192.168.252.3:9100
        labels:
          node: fleet-node-1

  - job_name: web
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://192.168.252.2:8080/
        labels:
          node: control-node
      - targets:
          - http://192.168.252.3:8080/
        labels:
          node: fleet-node-1
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
